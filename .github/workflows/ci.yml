name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # Hard cap so a hung test fails the job in minutes instead of burning the
    # 6h default (finding 2026-06: a Linux-only test hang deadlocked vitest with
    # no output for 25 min). Permanent safeguard, independent of the diagnostic
    # timeouts on the Test step below.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # DIAGNOSTIC (temporary): ubuntu-only to pinpoint the Linux-only test
        # hang without burning macOS minutes (billed 10x). Restore macos-latest
        # once the hang is fixed.
        os: [ubuntu-latest]
        node: ["22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Dev machines have ripgrep; the runner images do not. Without it the
      # grep-accelerator's real-rg tests silently early-return (coverage
      # theater on CI) and any test that reaches the regex→rg route fails
      # (finding 2026-06: env divergence shipped a red run). Installing it
      # makes CI exercise the same paths developers do.
      - name: Install ripgrep (CI/dev environment parity)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ripgrep
          else
            brew install ripgrep
          fi
          rg --version

      - name: Typecheck
        run: npm run typecheck:stable

      - name: Doc accuracy (landing + README vs source)
        run: npm run docs:check

      - name: Test
        # DIAGNOSTIC (temporary): sequential + verbose over ONLY the 21 not-completed
        # process/socket-spawning suspects → the hung file is the LAST one printed
        # before the run goes silent. `timeout` self-terminates so the job completes.
        # Restore to `npm test` after the fix.
        run: timeout 300 npx vitest run --no-file-parallelism --reporter=verbose --test-timeout=20000 --hook-timeout=20000 --teardown-timeout=20000 src/__tests__/suggestion-registry-parity.test.ts src/commands/__tests__/harness-multi-workspace.test.ts src/commands/harness-daemon.test.ts src/harness/__tests__/session-git-baseline.test.ts src/harness/__tests__/trigram-git.test.ts src/harness/__tests__/ubs-eval-input-tainted.test.ts src/harness/check-engine/__tests__/poison-corpus.test.ts src/harness/check-engine/spawn-async.test.ts src/harness/checks/tainted-sink.test.ts src/harness/checks/test-hygiene.test.ts src/harness/checks/ubs-language-specific/js-security-checks.test.ts src/harness/daemon-client.test.ts src/harness/library-footguns/child-process.test.ts src/harness/library-footguns/d1.test.ts src/harness/quality-checks/dependency-audit.test.ts src/harness/server/__tests__/socket-lifecycle.test.ts src/harness/session-paths.test.ts src/index.test.ts src/lib/__tests__/attribution.test.ts src/lib/__tests__/git-utils.test.ts src/lib/__tests__/hook-installers-claude.test.ts

      - name: Build
        run: npm run build

      - name: Lint package with publint
        run: npx publint

      - name: Check types with arethetypeswrong
        run: npx --package=@arethetypeswrong/cli attw --pack . --profile esm-only

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Tarball install smoke test
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/interlinked-cli-*.tgz | head -n 1)
          echo "Installing: $TARBALL"
          SMOKE_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install --no-save "$TARBALL"
          INTERLINKED=./node_modules/.bin/interlinked
          HOOK=./node_modules/.bin/interlinked-hook
          "$INTERLINKED" --version
          "$INTERLINKED" --help | head -5
          "$INTERLINKED" install-hooks --runner claude-code --mode balanced --json
          test -f .claude/settings.json
          grep -q -- "--runner 'claude-code'" .claude/settings.json
          printf '{"session_id":"smoke","cwd":"%s","tool_name":"Read","tool_input":{"file_path":"README.md"}}' "$PWD" \
            | "$HOOK" --runner claude-code --event PreToolUse
          mkdir -p src
          "$INTERLINKED" write src/smoke.ts --stdin --json <<< 'export const smoke: number = 1;'

      - name: Onboarding smoke test (git-clone install path)
        env:
          # Run against the in-tree checkout (already built above) so the
          # smoke catches drift introduced by the current PR before it lands.
          # On main pushes this also exercises the install path users would
          # walk through when they first try the project.
          INTERLINKED_REPO_URL: ${{ github.workspace }}
          INTERLINKED_REPO_REF: HEAD
        run: bash scripts/smoke-onboarding.sh
